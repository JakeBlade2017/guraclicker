<!DOCTYPE html>
<html>

<head>
  <title>Gura Clicker!</title>
  <link rel="icon" type="image/x-icon" href="/icons/gura_icon.png" />
  <link rel="stylesheet" href="style.css" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Delius&display=swap" rel="stylesheet">

  <!-- Scriptps -->
  <script src="counterScript.js"></script>
</head>

<body style="background-color: #30769d">
  <!-- Background music -->
  <audio id="bgMusic" autoplay loop>
    <source src="audio/bgmusic_1.ogg" type="audio/mpeg">
  </audio>

  <audio id="dancinMusic" src="audio/dancin_background.mp3"></audio>

  <!-- a Audio XD -->
  <audio id="aGura" src="audio/a.ogg"></audio>

  <!-- Gura dancin -->
  <img id="DancinGura" src="https://i.pinimg.com/originals/49/c9/b5/49c9b557693afc9db172dc4118463b9e.gif"
    alt="It's Gura dancing!" />

  <!-- Text -->
  <h1 id="instructions">Click 100 times the Gura plushie! :3</h1>

  <h2 id="txtCounter">100 times left!</h2>

  <!-- Gura -->
  <img id="GawrGura" src="images/00000.png" alt="Gura plushie" style="height: 420px" onclick="playFX()" />
  <audio id="plushSound" src="audio/plush-squeak.ogg"></audio>

  <script>
    function playFX() {
      var soundEffect = document.getElementById("plushSound");
      return soundEffect.play();
    }

    /* It is supposed to add delay when user clicks the plushie but, there are better ways :P */
    function delayPlayFX() {
      setTimeout(playFX, playFX.duration * 1000); // Delay playFX by 0.05 second
    }
  </script>

</body>

</html>
